<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fasca</title>
    <meta name="description" content="Fasca aiuta a organizzare scadenze, documenti e promemoria." />
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f6fb;
        --card: #ffffff;
        --text: #152345;
        --muted: #63708a;
        --primary: #246bfe;
        --border: #dce5f3;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      main {
        width: min(900px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
      }
      h1 { margin: 0 0 8px; font-size: clamp(34px, 7vw, 54px); line-height: 1.05; }
      p { color: var(--muted); font-size: 18px; margin: 0 0 22px; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 14px;
        background: var(--primary);
        color: #fff;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Fasca</h1>
        <p>Organizza documenti, scadenze, promemoria e pagamenti in un’unica app.</p>
        <a href="/privacy/">Privacy Policy</a>
      </section>
    </main>
  </body>
</html>
